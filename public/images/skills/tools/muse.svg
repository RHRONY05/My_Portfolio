  <circle cx="78" cy="34" r="3.5" fill="#06B6D4"/>
  <circle cx="50" cy="22" r="3" fill="#3B82F6"/>
  <line x1="50" y1="22" x2="50" y2="46" stroke="#3B82F6" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 3"/>
