<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="mdGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#00D2FF" />
    </linearGradient>
  </defs>

  <!-- Document Outline with folded corner -->
  <path d="M 26 62 V 15 C 26 11 29 8 33 8 H 56 L 74 26 V 62" 
        stroke="url(#mdGrad)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Folded Corner Flap -->
  <path d="M 56 8 V 26 H 74" 
        stroke="url(#mdGrad)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Document Text Lines -->
  <line x1="37" y1="21" x2="48" y2="21" stroke="url(#mdGrad)" stroke-width="5" stroke-linecap="round"/>
  <line x1="37" y1="31" x2="52" y2="31" stroke="url(#mdGrad)" stroke-width="5" stroke-linecap="round"/>
  <line x1="37" y1="41" x2="48" y2="41" stroke="url(#mdGrad)" stroke-width="5" stroke-linecap="round"/>

  <!-- Bottom "MARK" Badge Outline -->
  <rect x="12" y="62" width="76" height="30" rx="8" 
        stroke="url(#mdGrad)" stroke-width="5.5" fill="#111622"/>

  <!-- "M A R K" Stylized Text -->
  <!-- M -->
  <path d="M 23 83 V 71 C 23 71 27 75 28.5 75 C 30 75 34 71 34 71 V 83" 
        stroke="url(#mdGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- A -->
  <path d="M 40 83 V 73 C 40 71 42 70 44 70 C 46 70 48 71 48 73 V 83 M 40 77.5 H 48" 
        stroke="url(#mdGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- R -->
  <path d="M 54 83 V 71 H 60 C 62.5 71 64 72.5 64 74.5 C 64 76.5 62.5 78 60 78 H 54 M 60 78 L 64.5 83" 
        stroke="url(#mdGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- K -->
  <path d="M 70 71 V 83 M 78 71.5 L 71 77.5 L 78.5 83" 
        stroke="url(#mdGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
