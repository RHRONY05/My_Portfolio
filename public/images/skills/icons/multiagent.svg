  <line x1="18.5" y1="22.5" x2="20.5" y2="22.5" stroke-width="2"/>
  <line x1="25.5" y1="22.5" x2="27.5" y2="22.5" stroke-width="2"/>

  <!-- Top-Right Agent -->
  <circle cx="77" cy="23" r="14" stroke-width="3" fill="#141820"/>
