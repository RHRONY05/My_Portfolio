  <path d="M 80 36 A 40 40 0 0 1 80 64" stroke-width="2.5" stroke-dasharray="3 3.5"/>
  <path d="M 64 80 A 40 40 0 0 1 36 80" stroke-width="2.5" stroke-dasharray="3 3.5"/>
  <path d="M 20 64 A 40 40 0 0 1 20 36" stroke-width="2.5" stroke-dasharray="3 3.5"/>

  <!-- 4 Outer Subagent Badges (Nodes) -->
  <!-- Top-Left Agent -->
  <circle cx="23" cy="23" r="14" stroke-width="3" fill="#141820"/>
  <circle cx="23" cy="14" r="1.5" fill="#FFFFFF"/>
  <line x1="23" y1="14" x2="23" y2="17" stroke-width="1.8"/>
