<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3C77C" />
      <stop offset="100%" stop-color="#E5B869" />
    </linearGradient>
    <linearGradient id="terminalBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161B22" />
      <stop offset="100%" stop-color="#0D1117" />
    </linearGradient>
  </defs>

  <!-- Squircle Base for App Icon / Favicon -->
  <rect x="2" y="2" width="96" height="96" rx="24" fill="url(#terminalBg)" stroke="#30363D" stroke-width="2" />

  <!-- Code Window / Terminal Top Dots (Subtle) -->
  <circle cx="18" cy="16" r="2.5" fill="#30363D" />
  <circle cx="26" cy="16" r="2.5" fill="#30363D" />
  <circle cx="34" cy="16" r="2.5" fill="#30363D" />

  <!-- Terminal Command Prompt Chevron '>' -->
  <path d="M 22 36 L 36 50 L 22 64" 
        fill="none" 
        stroke="url(#goldGrad3)" 
        stroke-width="6.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Geometric Monogram [R] -->
  <!-- Vertical Bar -->
  <rect x="45" y="27" width="7" height="46" rx="2" fill="url(#goldGrad3)" />

  <!-- Upper Loop -->
  <path d="M 45 27 H 64 C 75 27 75 49 64 49 H 45" 
        fill="none" 
        stroke="url(#goldGrad3)" 
        stroke-width="7" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Sharp Diagonal Kick Leg -->
  <path d="M 57 48 L 73 72" 
        stroke="url(#goldGrad3)" 
        stroke-width="7" 
        stroke-linecap="round" />

  <!-- Glowing Terminal Cursor / AI Node '_' -->
  <rect x="78" y="69" width="9" height="3" rx="1.5" fill="#F3C77C" />
</svg>
