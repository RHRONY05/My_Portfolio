<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Inward Rotation</title>
    <style>
        body {
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            background: linear-gradient(45deg, #2c3e50, #4a69bd);
            /* Add perspective to the parent container */
            /* perspective: 800px; */
        }

        .main {
            height: 100vh;
            width: 100vw;
            background: linear-gradient(45deg, #2c3e50, #4a69bd);
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 800px;
            /* border-radius: 10px; */
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            /* Enable 3D transformations for child elements */
            transform-style: preserve-3d;
        }

        .innerdiv1 {
            height: 200px;
            width: 400px;
            background: tomato;
            /* Rotate on X-axis to create inward movement */
            transform: rotateY(15deg);
            transition: transform 0.5s ease;
        }
        .innerdiv2 {
            height: 200px;
            width: 400px;
            background: tomato;
            /* Rotate on X-axis to create inward movement */
            transform: rotateY(15deg);
            transition: transform 0.5s ease;
        }
    </style>
</head>

<body>
    <div class="main">
        <div class="innerdiv1">
            <p>Hello, my name is rony</p>
        </div>
        <div class="innerdiv2">
            <p>Hello, my name is rony</p>
        </div>
    </div>
</body>

</html>
