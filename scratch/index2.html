<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Right Side Rotation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(45deg, #2c3e50, #4a69bd);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .container {
            display: flex;
            /* gap: 30px; */
            perspective: 1000px;
        }

        .panel1 {
            width: 300px;
            height: 200px;
            background: #e74c3c;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 22px;
            font-weight: 600;
            transition: transform 0.4s ease;
            /* transform-origin: right center; */
            transform: rotateY(20deg);
        }
        .panel2 {
            width: 300px;
            height: 200px;
            background: #e74c3c;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 22px;
            font-weight: 600;
            transition: transform 0.4s ease;
            transform-origin: right center;
            transform: rotateY(-20deg);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="panel1">
            <p>Hello, my name is rony</p>
        </div>
        <div class="panel2">
            <p>Hello, my name is rony</p>
        </div>
    </div>
</body>
</html>
